[project]
name = "biot-sensor-assistant"
version = "2.0.0"
description = "LLM-powered IoT sensor assistant for the BioT Speech IoT project."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.89.0",
    "fastapi>=0.121.1",
    "httpx>=0.27",
    "mcp[cli]>=1.0.0",
    "google-genai>=1.70.0",
    "paho-mqtt>=2.1.0",
    "python-dotenv>=1.0",
    "requests>=2.32.5",
    "uvicorn>=0.30",
    "openai>=2.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
