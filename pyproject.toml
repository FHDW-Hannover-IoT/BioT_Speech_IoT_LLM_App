[project]
name = "biot-sensor-assistant"
version = "2.0.0"
description = "Claude-powered IoT sensor assistant for the BioT Speech IoT project."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.89.0",
    "fastapi>=0.121.1",
    "python-dotenv>=1.0",
    "requests>=2.32.5",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]